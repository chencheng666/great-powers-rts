<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大国崛起 · uTools</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1b1f;color:#e9f2ef;font:15px/1.7 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:28px}header{display:flex;align-items:center;gap:18px}header img{width:70px;height:70px}h1{font-size:30px;margin:0}small{color:#9cbbb5}.lead{color:#b8d0c9;margin:20px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}button{border:1px solid #49665e;border-radius:8px;padding:12px 18px;background:#19322f;color:#ebf4f0;font:inherit;cursor:pointer}button.primary{background:#8fd2bb;color:#112925;font-weight:bold}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:3px solid #e7cb8b;outline-offset:3px}section{padding:16px 18px;margin:20px 0;background:#132a2b;border-radius:10px}section p{margin:4px 0;font-size:13px;color:#b7ceca}footer{display:flex;gap:10px}footer button{font-size:13px;padding:7px 14px}#status{min-height:26px;color:#e6cb8a;font-size:13px}@media(max-width:500px){main{padding:18px}h1{font-size:25px}.actions button{width:100%}}
</style></head><body><main>
<header><img src="logo.png" alt="大国崛起图标"><div><h1>大国崛起</h1><small>2.0.2 · uTools 单机应用</small></div></header>
<p class="lead">建设基地，调度海陆空部队，选择战区与战术挑战。先从灰谷地带的入门指引开始。</p>
<div class="actions"><button class="primary" id="launch">打开独立战场</button><button id="online">在线试玩 / 联机</button></div>
<p id="status" role="status" aria-live="polite">首次打开会加载本地三维资源，后续可从“继续战局”恢复。</p>
<section><p>单机模型、音乐和语音随包安装，断网可玩；需要支持 WebGL2 的显卡和运行环境。</p><p>存档与荣誉保存在本机，更新前建议在战斗菜单导出 JSON 备份。与网页版存档独立。</p><p>本插件不自动上传玩家昵称、设备、时长或错误。主动提交意见反馈时才发送文字、可选图片与版本信息；在线试玩适用官网隐私说明。</p></section>
<footer><button id="website">官网</button><button id="github">开源代码</button><button id="privacy">隐私说明</button></footer>
</main><script src="launcher.js"></script></body></html>

name: Desktop release
on:
  workflow_dispatch:
  push:
    tags: ['v1.*', 'v2.*', 'v3.*']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: node --test --test-concurrency=1
      - run: npm run build
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci --registry=https://registry.npmjs.org
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '大国崛起 v__VERSION__ 程序化战场'
          releaseBody: '3.9.0前线增援：雪岭入海新单机使用指挥中心、后勤仓库、六机位机场与六泊位港口；飞机、舰艇从地图外调入，地面部队由可拦截运输机交付。优化电脑预算、集结、防守、返场、运输与护航，并控制长局寻路开销。程序化仓库、机场雷达和泊位。历史地图、旧存档、科幻版与联机沿用原规则；燃油及4.0战役尚未接入。官网 https://www.daguojueqi.site/ 。安装包构建与目标硬件实测分别说明。'
          # 复用同标签公开发行，避免已有网页包时额外生成同标签草稿。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

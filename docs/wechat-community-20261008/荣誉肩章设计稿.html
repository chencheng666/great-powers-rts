<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虚构荣誉肩章 · 设计提案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f2;color:#172b34;font-family:"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0}main{max-width:1420px;margin:auto;padding:48px 40px}header{border-bottom:2px solid #203b43;padding-bottom:24px;display:flex;justify-content:space-between;align-items:end;gap:24px}h1{font-size:34px;margin:8px 0}p{margin:0;line-height:1.7}.tag{font-size:14px;color:#aa343b;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:30px}.item{background:white;border:1px solid #d4dde0;border-radius:6px;padding:22px 18px;text-align:center}.item h2{font-size:20px;margin:16px 0 10px}.item p{font-size:14px;color:#526970}.shoulder{width:112px;height:232px;position:relative;margin:auto;background:repeating-linear-gradient(90deg,#213b42 0px,#213b42 2px,#1c343b 2px,#1c343b 4px);clip-path:polygon(15% 0,85% 0,100% 12%,100% 100%,0 100%,0 12%);border-bottom:9px solid var(--metal);box-shadow:inset 0 0 0 4px var(--metal)}.rivet{position:absolute;top:16px;left:46px;width:20px;height:20px;border-radius:50%;background:var(--metal);border:3px solid #ffffff55}.symbols{position:absolute;inset:55px 16px 32px;display:flex;align-items:center;justify-content:center;align-content:center;gap:8px;flex-wrap:wrap}.star{display:block;width:31px;height:31px;background:var(--metal);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 58%,79% 95%,50% 73%,21% 95%,32% 58%,2% 35%,39% 35%)}.bar{display:block;width:62px;height:9px;background:var(--metal);border:1px solid #ffffff55}.note{margin-top:25px;padding-top:20px;border-top:1px solid #c8d3d7;font-size:16px;color:#526970}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}.tag{margin-top:10px}}
</style></head><body><main><header><div><p>大国崛起 / 指挥官荣誉</p><h1>把每一次凯旋，戴在肩上</h1><p>虚构肩章样式提案 · 不对应现实军衔 · 无战斗属性加成</p></div><p class="tag">仅为设计稿，尚未加入游戏</p></header><section class="grid" id="ranks"></section><p class="note">保留现有积分与胜场，双门槛晋级。失败不降级；联机排位另行设计。金属边框、星形与横杠共同区分等级，不只依赖颜色。</p></main>
<script>
const ranks=[['预备指挥官',0,0,0,1,'#aebfc5'],['前线新锐',100,1,1,0,'#aebfc5'],['装甲先锋',400,3,2,0,'#aebfc5'],['战术专家',1000,6,3,0,'#aebfc5'],['战区统帅',2000,10,1,1,'#d6b96f'],['王牌指挥官',3600,18,2,1,'#d6b96f'],['战略大师',6000,28,3,1,'#d6b96f'],['传奇元帅',9500,45,3,2,'#e1bd70']];
document.querySelector('#ranks').innerHTML=ranks.map(([name,points,wins,stars,bars,metal],i)=>`<article class="item"><div class="shoulder" style="--metal:${metal}"><span class="rivet"></span><div class="symbols">${'<span class="star"></span>'.repeat(stars)}${'<span class="bar"></span>'.repeat(bars)}</div></div><h2>${i+1} · ${name}</h2><p>${points.toLocaleString()} 荣誉分 + ${wins} 场胜利</p></article>`).join('');
</script></body></html>
